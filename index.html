<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishcraft Designs | Birthday Card Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #fff0f6, #f3e8ff, #e0f2fe);
      color: #25233a;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    .logo {
      font-size: 2.4rem;
      font-weight: 800;
      margin-top: 25px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      color: #6b6478;
      margin-bottom: 30px;
      font-size: 1rem;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.88);
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(100, 70, 130, 0.15);
      backdrop-filter: blur(10px);
    }

    label {
      display: block;
      text-align: left;
      font-weight: 700;
      margin: 14px 0 8px;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      border: 2px solid #eee5f5;
      border-radius: 13px;
      font-size: 1rem;
      outline: none;
      background: white;
      transition: 0.25s;
    }

    input:focus,
    select:focus {
      border-color: #c084fc;
      box-shadow: 0 0 0 4px rgba(192, 132, 252, 0.12);
    }

    .generate-btn {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(139, 92, 246, 0.3);
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    /* Birthday Card */
    .card-wrapper {
      display: none;
      margin-top: 30px;
      position: relative;
    }

    .card-wrapper.show {
      display: block;
      animation: cardAppear 0.8s ease forwards;
    }

    .birthday-card {
      position: relative;
      overflow: hidden;
      padding: 42px 25px;
      border-radius: 28px;
      background: linear-gradient(145deg, #ffffff, #fff7fb);
      box-shadow: 0 18px 50px rgba(100, 70, 130, 0.2);
      border: 1px solid rgba(255,255,255,0.8);
    }

    .cake {
      font-size: 4rem;
      animation: bounce 1.8s infinite;
      margin-bottom: 10px;
    }

    .birthday-card h2 {
      color: #ec4899;
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .birthday-card p {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #514b61;
    }

    .name {
      color: #8b5cf6;
      font-weight: 800;
    }

    .share-btn {
      margin-top: 20px;
      padding: 13px 24px;
      border: none;
      border-radius: 12px;
      background: #25233a;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .share-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .footer {
      margin: 30px 0 10px;
      color: #777083;
      font-size: 0.9rem;
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 9px;
      height: 15px;
      top: -20px;
      animation: fall 2.8s linear infinite;
      opacity: 0;
    }

    .confetti:nth-child(1) { left: 5%; animation-delay: 0.1s; }
    .confetti:nth-child(2) { left: 15%; animation-delay: 0.5s; }
    .confetti:nth-child(3) { left: 25%; animation-delay: 0.2s; }
    .confetti:nth-child(4) { left: 35%; animation-delay: 0.8s; }
    .confetti:nth-child(5) { left: 45%; animation-delay: 0.3s; }
    .confetti:nth-child(6) { left: 55%; animation-delay: 0.7s; }
    .confetti:nth-child(7) { left: 65%; animation-delay: 0.4s; }
    .confetti:nth-child(8) { left: 75%; animation-delay: 1s; }
    .confetti:nth-child(9) { left: 85%; animation-delay: 0.6s; }
    .confetti:nth-child(10) { left: 95%; animation-delay: 0.9s; }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(450px) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes cardAppear {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .logo {
        font-size: 2rem;
        margin-top: 15px;
      }

      .form-box {
        padding: 21px;
        border-radius: 20px;
      }

      .birthday-card {
        padding: 35px 18px;
      }

      .birthday-card h2 {
        font-size: 1.65rem;
      }

      .birthday-card p {
        font-size: 1rem;
      }

      .cake {
        font-size: 3.4rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1 class="logo">Wishcraft ✨</h1>
    <p class="tagline">Create a beautiful birthday wish in seconds 🎂</p>

    <div class="form-box">

      <label for="friendName">Friend's Name</label>
      <input
        type="text"
        id="friendName"
        placeholder="Enter your friend's name"
        maxlength="40"
      >

      <label for="message">Choose a Birthday Message</label>

      <select id="message">
        <option value="Wishing you a day filled with happiness, laughter, and beautiful memories! 🎉">
          Wishing you a day filled with happiness! 🎉
        </option>

        <option value="May your birthday be as wonderful and special as you are. Have an amazing day! 💖">
          May your birthday be wonderful and special! 💖
        </option>

        <option value="Another year, another reason to celebrate! Wishing you lots of happiness and success! 🥳">
          Another year, another reason to celebrate! 🥳
        </option>

        <option value="Hope your special day is full of smiles, fun, love, and unforgettable moments! 🎂">
          Hope your special day is full of smiles and fun! 🎂
        </option>

        <option value="Sending you lots of warm wishes on your birthday. Keep smiling and enjoy your special day! 🌸">
          Sending you lots of warm birthday wishes! 🌸
        </option>
      </select>

      <button class="generate-btn" onclick="generateCard()">
        ✨ Generate Birthday Card
      </button>

    </div>

    <!-- Hidden Card -->
    <div class="card-wrapper" id="cardWrapper">

      <!-- Pure CSS Confetti -->
      <span class="confetti">🎊</span>
      <span class="confetti">🎉</span>
      <span class="confetti">✨</span>
      <span class="confetti">🎈</span>
      <span class="confetti">🎊</span>
      <span class="confetti">✨</span>
      <span class="confetti">🎉</span>
      <span class="confetti">🎈</span>
      <span class="confetti">✨</span>
      <span class="confetti">🎊</span>

      <div class="birthday-card">

        <div class="cake">🎂</div>

        <h2>Happy Birthday, <span class="name" id="cardName"></span>! 🎉</h2>

        <p id="cardMessage"></p>

        <button class="share-btn" onclick="shareCard()">
          🔗 Share Birthday Card
        </button>

      </div>

    </div>

    <p class="footer">
      Made with 💖 by Wishcraft Designs
    </p>

  </div>


  <script>

    function generateCard() {

      const nameInput = document.getElementById("friendName");
      const messageInput = document.getElementById("message");

      const name = nameInput.value.trim();
      const message = messageInput.value;

      if (name === "") {
        alert("Please enter your friend's name first! 😊");
        nameInput.focus();
        return;
      }

      document.getElementById("cardName").textContent = name;
      document.getElementById("cardMessage").textContent = message;

      const cardWrapper = document.getElementById("cardWrapper");

      cardWrapper.classList.remove("show");

      // Restart animation
      void cardWrapper.offsetWidth;

      cardWrapper.classList.add("show");

      setTimeout(() => {
        cardWrapper.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }, 150);
    }


    async function shareCard() {

      const name = document.getElementById("friendName").value.trim();

      const shareText =
        "🎂 I created a birthday wish for " +
        name +
        " with Wishcraft! ✨";

      if (navigator.share) {

        try {

          await navigator.share({
            title: "Birthday Wish - Wishcraft",
            text: shareText,
            url: window.location.href
          });

        } catch (error) {
          // User cancelled sharing
        }

      } else {

        try {

          await navigator.clipboard.writeText(window.location.href);

          alert(
            "Website link copied! 🎉\n\nSend it to your friend!"
          );

        } catch (error) {

          alert(
            "Copy this website link:\n\n" +
            window.location.href
          );

        }

      }

    }

  </script>

</body>
</html>
